# JVM sizing for a 6 GB device: keep the daemon comfortable but bounded.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true

# AndroidX is required for Compose and all androidx.* dependencies.
android.useAndroidX=true
android.nonTransitiveRClass=true

# AGP 9 built-in Kotlin compiles the Kotlin sources; the Compose compiler
# plugin is layered on top.
android.builtInKotlin=true

# Suppress an annoying snapshot from creating platform timestamps.
org.gradle.configuration-cache=true

kotlin.code.style=official
